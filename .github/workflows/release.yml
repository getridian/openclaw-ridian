name: ClawHub release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clawhub-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check release identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('openclaw.plugin.json', 'utf8'));
          assert.equal(process.env.GITHUB_REPOSITORY, 'getridian/openclaw-ridian');
          assert.match(pkg.version, /^\d+\.\d+\.\d+-alpha\.\d+$/);
          assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`);
          assert.equal(pkg.version, manifest.version);
          JS
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Package and inspect the published files
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/unpacked"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          tar -xzf "$RUNNER_TEMP"/release/*.tgz -C "$RUNNER_TEMP/unpacked"
          npx --yes clawhub@0.23.3 package validate "$RUNNER_TEMP/unpacked/package" \
            --openclaw-version 2026.10.4 --out "$RUNNER_TEMP/inspector" --json
          npx --yes clawhub@0.23.3 package publish "$RUNNER_TEMP/unpacked/package" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --tags alpha --dry-run --json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: plugin-inspector
          path: ${{ runner.temp }}/inspector
          if-no-files-found: ignore
  publish:
    needs: [checks, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: clawhub
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release
      - name: Publish through GitHub OIDC
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/release/*.tgz -C "$RUNNER_TEMP/unpacked"
          npx --yes clawhub@0.23.3 package publish "$RUNNER_TEMP/unpacked/package" \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --tags alpha --wait --wait-timeout 900 --json \
            > "$RUNNER_TEMP/publication.json"
          cat "$RUNNER_TEMP/publication.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: publication-receipt
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: ignore
